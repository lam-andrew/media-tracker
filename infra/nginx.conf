server {
 listen 8080;
 server_name _;
 client_max_body_size 2m;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /healthz { access_log off; return 200 "ok"; }
 location /api/ { proxy_pass http://api:3201; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
