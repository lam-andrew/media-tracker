name: marqd-v2
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marqd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: marqd_v2
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U marqd -d marqd_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    init: true
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://marqd:${POSTGRES_PASSWORD}@db:5432/marqd_v2
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REQUIRE_EMAIL_CONFIRMATION: ${REQUIRE_EMAIL_CONFIRMATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORT: 3201
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3201/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 5
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3200}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
