name: CI
on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [v2, main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marqd
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: marqd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marqd -d marqd_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run install:apps
      - run: npm audit --prefix apps/api --omit=dev --audit-level=high
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://marqd:test-only-password@localhost:5432/marqd_test
      - run: npm run test:ui
      - run: npm run build
      - run: docker build -f infra/api.Dockerfile . && docker build -f infra/web.Dockerfile .
      - name: Deployment controller tests
        run: python3 -m unittest discover -s infra/deploy -p 'test_*.py' -v
      - name: Container smoke test (isolated CI database)
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: |
          docker compose -p marqd-ci -f infra/compose.yaml up --build -d --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3200/api/health
          curl --fail http://127.0.0.1:3200/healthz
      - name: Remove isolated CI containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: docker compose -p marqd-ci -f infra/compose.yaml down -v
  publish:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
