name: CI

# Quality gates on every push and PR: lint, format, type-check, tests, and a production
# build — the same checks the pre-commit hooks run locally. See
# docs/adr/0005-quality-gates-and-security-scanning.md.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
