name: V2
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2, main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marqd
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: marqd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marqd -d marqd_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run v2:install
      - run: npm audit --prefix apps/api --omit=dev --audit-level=high
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high
      - run: npm run v2:lint
      - run: npm run v2:typecheck
      - run: npm run v2:test
        env:
          TEST_DATABASE_URL: postgresql://marqd:test-only-password@localhost:5432/marqd_test
      - run: npm run v2:test:ui
      - run: npm run v2:build
      - run: docker build -f infra/api.Dockerfile . && docker build -f infra/web.Dockerfile .
